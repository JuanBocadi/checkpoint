# Blueprint de Render. Si un nombre no está disponible, actualizar también
# la URL del rewrite y BETTER_AUTH_URL antes del deploy definitivo.
services:
  - type: web
    name: checkpoint-api-juanbocadi
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        value: https://checkpoint-juanbocadi.onrender.com
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
  - type: web
    name: checkpoint-juanbocadi
    runtime: static
    rootDir: frontend
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 24
    routes:
      - type: rewrite
        source: /api/*
        destination: https://checkpoint-api-juanbocadi.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
